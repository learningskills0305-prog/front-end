<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="(https://fonts.google.com/specimen/Outfit)">
  
  <title>Frontend Mentor | QR code component</title>

  <style>
    body{
      color:hsl(0, 0%, 100%);
      background-color: hsl(212, 45%, 89%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 600px;
    }
    .main-container{
      background-color:  hsl(0, 0%, 100%);
      width: 250px;
      min-height: 400px;
      text-align: center;
      padding: 10px;
      padding-bottom: 40px;
      border-radius: 10px;
    }

    .QR-img img{
      width: 250px;
      border-radius: 10px;
    }
    .main-text h3{
      color: black;
      font-weight: 400,700;
    }

    .main-text p{
      color: hsl(216, 15%, 48%);
    }
    
  </style>
</head>
<body>
  <div class="main-container">
     <div class="QR-img">
      <img src="images/image-qr-code.png" alt="QR-image">
     </div>
     <div class="main-text">
      <h3>Improve you front-end skills by building projects</h3>
      <p>Scan the QR-code to visit frontend mentor and take your coding skill to the next level</p>
     </div>
  </div>


</body>
</html>
